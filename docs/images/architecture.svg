<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
  <title id="title">ReachInbox Scheduler architecture</title>
  <desc id="desc">The React frontend calls the Express API. The API saves the campaign and recipient rows to PostgreSQL in one transaction, then adds one delayed BullMQ job per recipient to Redis. When a job is due, the worker claims the row in PostgreSQL, checks the hourly counter in Redis, sends through Ethereal SMTP and marks the row SENT. On startup the worker re-enqueues any pending row that has no job.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .store { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .proc { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .title { font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .lbl { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .edge { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .dash { stroke: #57606a; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #6e7681; }
      .store { fill: #0c2d6b; stroke: #4493f8; }
      .proc { fill: #3b2e00; stroke: #d29922; }
      .title, .lbl { fill: #e6edf3; }
      .sub, .code { fill: #9198a1; }
      .edge, .dash { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="600" rx="12"/>

  <!-- Frontend -->
  <rect class="box" x="30" y="60" width="190" height="100" rx="10"/>
  <text class="title" x="125" y="95" text-anchor="middle">React frontend</text>
  <text class="sub" x="125" y="117" text-anchor="middle">Vite + Tailwind</text>
  <text class="sub" x="125" y="137" text-anchor="middle">polls lists every 5s</text>

  <!-- API -->
  <rect class="proc" x="330" y="60" width="250" height="100" rx="10"/>
  <text class="title" x="455" y="95" text-anchor="middle">Express API</text>
  <text class="sub" x="455" y="117" text-anchor="middle">Google OAuth · validation</text>
  <text class="sub" x="455" y="137" text-anchor="middle">assignSendSlots()</text>

  <!-- Postgres -->
  <rect class="store" x="720" y="60" width="250" height="100" rx="10"/>
  <text class="title" x="845" y="95" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="845" y="117" text-anchor="middle">Campaign · EmailRecipient</text>
  <text class="code" x="845" y="137" text-anchor="middle">status · claimedAt · windowIndex</text>

  <!-- Redis -->
  <rect class="store" x="330" y="300" width="250" height="120" rx="10"/>
  <text class="title" x="455" y="333" text-anchor="middle">Redis</text>
  <text class="sub" x="455" y="355" text-anchor="middle">BullMQ delayed jobs</text>
  <text class="code" x="455" y="375" text-anchor="middle">jobId = &lt;rowId&gt;-w&lt;window&gt;</text>
  <text class="code" x="455" y="395" text-anchor="middle">rate:&lt;campaign&gt;:&lt;window&gt;</text>

  <!-- Worker -->
  <rect class="proc" x="720" y="300" width="250" height="120" rx="10"/>
  <text class="title" x="845" y="333" text-anchor="middle">BullMQ worker</text>
  <text class="sub" x="845" y="355" text-anchor="middle">separate process</text>
  <text class="sub" x="845" y="375" text-anchor="middle">claim → rate check → send</text>
  <text class="sub" x="845" y="395" text-anchor="middle">concurrency = WORKER_CONCURRENCY</text>

  <!-- Ethereal -->
  <rect class="box" x="720" y="490" width="250" height="80" rx="10"/>
  <text class="title" x="845" y="523" text-anchor="middle">Ethereal SMTP</text>
  <text class="sub" x="845" y="545" text-anchor="middle">fake inbox + preview URL</text>

  <!-- Frontend -> API -->
  <line class="edge" x1="220" y1="110" x2="326" y2="110" marker-end="url(#arrow)"/>
  <text class="lbl" x="273" y="92" text-anchor="middle">REST +</text>
  <text class="lbl" x="273" y="132" text-anchor="middle">session</text>

  <!-- API -> Postgres -->
  <line class="edge" x1="580" y1="110" x2="716" y2="110" marker-end="url(#arrow)"/>
  <text class="lbl" x="648" y="92" text-anchor="middle">① save rows</text>
  <text class="lbl" x="648" y="132" text-anchor="middle">one transaction</text>

  <!-- API -> Redis -->
  <line class="edge" x1="455" y1="160" x2="455" y2="296" marker-end="url(#arrow)"/>
  <text class="lbl" x="467" y="225">② enqueue one delayed</text>
  <text class="lbl" x="467" y="243">job per recipient</text>

  <!-- Redis -> Worker (job due) -->
  <line class="edge" x1="580" y1="340" x2="716" y2="340" marker-end="url(#arrow)"/>
  <text class="lbl" x="648" y="330" text-anchor="middle">③ job due</text>

  <!-- Worker -> Redis (startup reconcile) -->
  <line class="dash" x1="720" y1="395" x2="584" y2="395" marker-end="url(#arrow)"/>
  <text class="lbl" x="648" y="415" text-anchor="middle">on startup:</text>
  <text class="lbl" x="648" y="432" text-anchor="middle">reconcile</text>

  <!-- Worker <-> Postgres -->
  <line class="edge" x1="845" y1="296" x2="845" y2="164" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="857" y="225">④ claim row (CAS),</text>
  <text class="lbl" x="857" y="243">⑥ mark SENT / FAILED</text>

  <!-- Worker -> Ethereal -->
  <line class="edge" x1="845" y1="420" x2="845" y2="486" marker-end="url(#arrow)"/>
  <text class="lbl" x="857" y="458">⑤ send</text>
</svg>
